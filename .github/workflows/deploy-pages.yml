# Deploys the SustainSutra frontend to GitHub Pages.
#
# Setup (one-time):
#   Repo Settings → Pages → Source: "GitHub Actions"
#
# The site is then served at https://amitkr64.github.io/sustainsutra/
# For a custom domain, add a CNAME file to public/ and set BASE_PATH=/ in
# the build step below.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # Project pages live under /sustainsutra/ — the Dockerfile build
          # (real domain, served at the root) uses BASE_PATH=/ instead.
          BASE_PATH: /sustainsutra/
          # Point at a hosted API if you have one; leave empty to keep
          # same-origin (works once an API is served behind the same domain).
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages has no SPA rewrite: serve index.html for unknown paths
      # so React Router deep links (e.g. /insights) still work.
      - name: SPA fallback (404 page)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
