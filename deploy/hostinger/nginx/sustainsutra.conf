# SustainSutra — production nginx vhost for a Hostinger VPS
#
# Install to /etc/nginx/sites-available/sustainsutra.conf, symlink into
# sites-enabled, replace sustainsutra.in with your domain, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Node backend is expected on 127.0.0.1:5000 (run via PM2, see
# ecosystem.config.js). Certbot will add the SSL blocks automatically:
#   sudo certbot --nginx -d sustainsutra.in -d www.sustainsutra.in

upstream sustainsutra_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sustainsutra.in www.sustainsutra.in;

    # ---- Static frontend (Vite build output) -------------------------------
    root /var/www/sustainsutra/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # Max upload (BRSR/CCTS portals post XBRL files through the API)
    client_max_body_size 12m;

    # React Router: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets — cache hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must not be cached
       location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # ---- API proxy ----------------------------------------------------------
    location /api/ {
        proxy_pass http://sustainsutra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SEO: dynamic sitemap/robots from the backend ------------------------
    location = /sitemap.xml { proxy_pass http://sustainsutra_api; proxy_set_header Host $host; }
    location = /robots.txt   { proxy_pass http://sustainsutra_api; proxy_set_header Host $host; }

    # Long-cache images/fonts at the root
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
