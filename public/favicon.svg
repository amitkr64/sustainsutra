<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leafSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5016;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#3B7A27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circuit lines (subtle, radiating from center) -->
  <g stroke="#E0E0E0" stroke-width="0.8" fill="none" opacity="0.5">
    <path d="M 50 15 L 50 8" />
    <path d="M 50 85 L 50 92" />
    <path d="M 15 50 L 8 50" />
    <path d="M 85 50 L 92 50" />
    <path d="M 25 25 L 18 18" />
    <path d="M 75 75 L 82 82" />
    <path d="M 75 25 L 82 18" />
    <path d="M 25 75 L 18 82" />
  </g>

  <!-- Circuit nodes (cyan accents) -->
  <g fill="#00BCD4">
    <circle cx="50" cy="6" r="2" />
    <circle cx="50" cy="94" r="2" />
    <circle cx="6" cy="50" r="2" />
    <circle cx="94" cy="50" r="2" />
    <circle cx="16" cy="16" r="1.5" />
    <circle cx="84" cy="84" r="1.5" />
    <circle cx="84" cy="16" r="1.5" />
    <circle cx="16" cy="84" r="1.5" />
  </g>

  <!-- Stylized S / Leaf hybrid -->
  <!-- The S curves like a leaf, with a center vein -->
  <path d="M 68 25
           C 58 18, 42 22, 35 32
           C 30 40, 35 48, 45 50
           C 55 52, 68 55, 65 68
           C 62 78, 50 82, 38 78
           C 32 75, 28 70, 30 64"
        fill="none"
        stroke="url(#leafSGrad)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Leaf vein (center line through the S) -->
  <path d="M 48 28 L 48 72"
        fill="none"
        stroke="#4CAF50"
        stroke-width="1.5"
        opacity="0.6" />

  <!-- Small leaf veins branching from center -->
  <g stroke="#4CAF50" stroke-width="0.8" opacity="0.4" fill="none">
    <path d="M 48 38 L 55 35" />
    <path d="M 48 45 L 56 43" />
    <path d="M 48 55 L 42 53" />
    <path d="M 48 62 L 41 60" />
    <path d="M 48 68 L 55 66" />
  </g>
</svg>
